<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff006e"/>
      <stop offset="100%" stop-color="#3a86ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#ff006e" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ff006e" stop-opacity="0"/>
    </radialGradient>
    <style>
      .inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#0a0a0a"/>
  <rect width="1080" height="1350" fill="url(#glow1)"/>

  <!-- Logo -->
  <rect x="72" y="72" width="48" height="48" rx="12" fill="#18181b"/>
  <circle cx="96" cy="96" r="9" fill="#c87cb3"/>
  <text x="136" y="102" fill="#fafafa" font-size="20" font-weight="700" class="inter" letter-spacing="-0.5">ChromaBrew</text>

  <!-- Day label -->
  <text x="1008" y="100" text-anchor="end" fill="#525252" font-size="12" font-weight="500" class="mono" letter-spacing="2">DAY 01</text>

  <!-- Hero -->
  <text x="72" y="220" fill="#fafafa" font-size="74" font-weight="900" class="inter" letter-spacing="-3">6 harmony</text>
  <text x="72" y="300" fill="#fafafa" font-size="74" font-weight="900" class="inter" letter-spacing="-3">strategies.</text>
  <text x="72" y="370" font-size="74" font-weight="900" class="inter" letter-spacing="-3">
    <tspan fill="url(#accentGrad)">One click.</tspan>
  </text>

  <!-- Palette visualization -->
  <g transform="translate(72, 420)">
    <!-- Analogous -->
    <text x="0" y="0" fill="#525252" font-size="11" font-weight="500" class="mono" letter-spacing="1">ANALOGOUS</text>
    <rect x="0" y="12" width="60" height="60" rx="8" fill="#ff006e"/>
    <rect x="68" y="12" width="60" height="60" rx="8" fill="#ff4d94"/>
    <rect x="136" y="12" width="60" height="60" rx="8" fill="#ff80b8"/>
    <rect x="204" y="12" width="60" height="60" rx="8" fill="#ffb3d9"/>
    <rect x="272" y="12" width="60" height="60" rx="8" fill="#ffe0ee"/>

    <!-- Complementary -->
    <text x="0" y="100" fill="#525252" font-size="11" font-weight="500" class="mono" letter-spacing="1">COMPLEMENTARY</text>
    <rect x="0" y="112" width="60" height="60" rx="8" fill="#3a86ff"/>
    <rect x="68" y="112" width="60" height="60" rx="8" fill="#83b8ff"/>
    <rect x="136" y="112" width="60" height="60" rx="8" fill="#ffd166"/>
    <rect x="204" y="112" width="60" height="60" rx="8" fill="#ffaa00"/>
    <rect x="272" y="112" width="60" height="60" rx="8" fill="#ff8800"/>

    <!-- Triadic -->
    <text x="0" y="200" fill="#525252" font-size="11" font-weight="500" class="mono" letter-spacing="1">TRIADIC</text>
    <rect x="0" y="212" width="60" height="60" rx="8" fill="#8338ec"/>
    <rect x="68" y="212" width="60" height="60" rx="8" fill="#a66ef5"/>
    <rect x="136" y="212" width="60" height="60" rx="8" fill="#3a86ff"/>
    <rect x="204" y="212" width="60" height="60" rx="8" fill="#ff006e"/>
    <rect x="272" y="212" width="60" height="60" rx="8" fill="#ff4d94"/>

    <!-- Split-complementary -->
    <text x="460" y="0" fill="#525252" font-size="11" font-weight="500" class="mono" letter-spacing="1">SPLIT-COMPLEMENTARY</text>
    <rect x="460" y="12" width="60" height="60" rx="8" fill="#22c55e"/>
    <rect x="528" y="12" width="60" height="60" rx="8" fill="#4ade80"/>
    <rect x="596" y="12" width="60" height="60" rx="8" fill="#ff006e"/>
    <rect x="664" y="12" width="60" height="60" rx="8" fill="#ff4d94"/>
    <rect x="732" y="12" width="60" height="60" rx="8" fill="#3a86ff"/>

    <!-- Monochromatic -->
    <text x="460" y="100" fill="#525252" font-size="11" font-weight="500" class="mono" letter-spacing="1">MONOCHROMATIC</text>
    <rect x="460" y="112" width="60" height="60" rx="8" fill="#eff6ff"/>
    <rect x="528" y="112" width="60" height="60" rx="8" fill="#bfdbfe"/>
    <rect x="596" y="112" width="60" height="60" rx="8" fill="#3a86ff"/>
    <rect x="664" y="112" width="60" height="60" rx="8" fill="#1d4ed8"/>
    <rect x="732" y="112" width="60" height="60" rx="8" fill="#172554"/>

    <!-- Tetradic -->
    <text x="460" y="200" fill="#525252" font-size="11" font-weight="500" class="mono" letter-spacing="1">TETRADIC</text>
    <rect x="460" y="212" width="60" height="60" rx="8" fill="#ff006e"/>
    <rect x="528" y="212" width="60" height="60" rx="8" fill="#3a86ff"/>
    <rect x="596" y="212" width="60" height="60" rx="8" fill="#ffd166"/>
    <rect x="664" y="212" width="60" height="60" rx="8" fill="#22c55e"/>
    <rect x="732" y="212" width="60" height="60" rx="8" fill="#8338ec"/>
  </g>

  <!-- Tagline -->
  <text x="72" y="830" fill="#fafafa" font-size="32" font-weight="700" class="inter" letter-spacing="-1">Complementary. Triadic. Analogous.</text>
  <text x="72" y="866" fill="#fafafa" font-size="32" font-weight="700" class="inter" letter-spacing="-1">Split-comp. Mono. Tetradic.</text>
  <text x="72" y="910" fill="#737373" font-size="18" font-weight="400" class="inter">All computed in OKLCH for perceptual consistency.</text>

  <!-- Badge -->
  <rect x="72" y="960" width="400" height="48" rx="100" fill="#171717" stroke="#262626" stroke-width="1"/>
  <circle cx="100" cy="984" r="5" fill="#22c55e"/>
  <text x="118" y="989" fill="#a3a3a3" font-size="13" font-weight="500" class="inter">Free — runs entirely in your browser</text>

  <!-- Bottom -->
  <text x="72" y="1280" fill="#fafafa" font-size="20" font-weight="600" class="inter" letter-spacing="-0.3">chromabrew.com</text>
  <text x="1008" y="1280" text-anchor="end" fill="#525252" font-size="11" class="mono">PALETTE GENERATOR</text>
</svg>
