<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#3a86ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#0a0a0a"/>
  <rect width="1080" height="1350" fill="url(#glow1)"/>

  <!-- Logo -->
  <rect x="72" y="72" width="56" height="56" rx="14" fill="#18181b"/>
  <circle cx="100" cy="100" r="11" fill="#c87cb3"/>
  <text x="144" y="108" fill="#fafafa" font-size="24" font-weight="700" class="inter" letter-spacing="-0.5">ChromaBrew</text>
  <text x="1008" y="100" text-anchor="end" fill="#525252" font-size="13" font-weight="500" class="mono" letter-spacing="2">WCAG CHEATSHEET</text>

  <!-- Hero -->
  <text x="72" y="236" fill="#fafafa" font-size="76" font-weight="900" class="inter" letter-spacing="-3">Contrast.</text>
  <text x="72" y="318" font-size="76" font-weight="900" class="inter" letter-spacing="-3">
    <tspan fill="url(#accentGrad)">Memorize these.</tspan>
  </text>
  <text x="72" y="380" fill="#737373" font-size="20" class="inter" letter-spacing="-0.2">The four WCAG 2.x thresholds you</text>
  <text x="72" y="410" fill="#737373" font-size="20" class="inter" letter-spacing="-0.2">actually need day-to-day.</text>

  <!-- Threshold cards -->
  <g transform="translate(72, 460)">
    <!-- AA normal -->
    <rect x="0" y="0" width="900" height="150" rx="16" fill="#131316" stroke="#262626" stroke-width="1"/>
    <circle cx="50" cy="75" r="26" fill="#171717"/>
    <text x="50" y="85" text-anchor="middle" fill="#fafafa" font-size="26" font-weight="800" class="mono">AA</text>
    <text x="110" y="66" fill="#fafafa" font-size="22" font-weight="700" class="inter">4.5 : 1</text>
    <text x="110" y="94" fill="#737373" font-size="15" class="inter">Normal text · AA grade</text>

    <g transform="translate(940, 0)">
      <rect x="0" y="0" width="68" height="150" rx="16" fill="#22c55e" opacity="0.9"/>
    </g>

    <!-- AAA normal -->
    <rect x="0" y="180" width="900" height="150" rx="16" fill="#131316" stroke="#262626" stroke-width="1"/>
    <circle cx="50" cy="255" r="26" fill="#171717"/>
    <text x="50" y="265" text-anchor="middle" fill="#fafafa" font-size="24" font-weight="800" class="mono">AAA</text>
    <text x="110" y="246" fill="#fafafa" font-size="22" font-weight="700" class="inter">7 : 1</text>
    <text x="110" y="274" fill="#737373" font-size="15" class="inter">Normal text · AAA grade</text>

    <g transform="translate(940, 180)">
      <rect x="0" y="0" width="68" height="150" rx="16" fill="#3a86ff"/>
    </g>

    <!-- AA large -->
    <rect x="0" y="360" width="900" height="150" rx="16" fill="#131316" stroke="#262626" stroke-width="1"/>
    <circle cx="50" cy="435" r="26" fill="#1d4ed8"/>
    <text x="50" y="445" text-anchor="middle" fill="#fafafa" font-size="24" font-weight="800" class="mono">AA</text>
    <text x="110" y="426" fill="#fafafa" font-size="22" font-weight="700" class="inter">3 : 1</text>
    <text x="110" y="454" fill="#737373" font-size="15" class="inter">Large text (18pt+ / 14pt bold)</text>

    <!-- AAA large -->
    <rect x="0" y="540" width="900" height="150" rx="16" fill="#131316" stroke="#262626" stroke-width="1"/>
    <circle cx="50" cy="615" r="26" fill="#171717"/>
    <text x="50" y="625" text-anchor="middle" fill="#fafafa" font-size="24" font-weight="800" class="mono">AAA</text>
    <text x="110" y="606" fill="#fafafa" font-size="22" font-weight="700" class="inter">4.5 : 1</text>
    <text x="110" y="634" fill="#737373" font-size="15" class="inter">Large text · AAA grade</text>
  </g>

  <!-- Tagline -->
  <text x="72" y="1090" fill="#fafafa" font-size="28" font-weight="700" class="inter" letter-spacing="-1">If a pair fails, fix it —</text>
  <text x="72" y="1124" fill="#fafafa" font-size="28" font-weight="700" class="inter" letter-spacing="-1">don't ship a 2.1:1 grey text.</text>
  <text x="72" y="1168" fill="#737373" font-size="18" class="inter">ChromaBrew checks every pair and auto-adjusts lightness — hue preserved.</text>

  <!-- Badge -->
  <rect x="72" y="1210" width="430" height="48" rx="100" fill="#171717" stroke="#262626" stroke-width="1"/>
  <circle cx="100" cy="1234" r="5" fill="#22c55e"/>
  <text x="118" y="1239" fill="#a3a3a3" font-size="13" font-weight="500" class="inter">Check palettes free in your browser</text>

  <!-- Bottom -->
  <text x="72" y="1300" fill="#fafafa" font-size="20" font-weight="600" class="inter" letter-spacing="-0.3">chromabrew.com</text>
  <text x="1008" y="1300" text-anchor="end" fill="#525252" font-size="11" class="mono">WCAG PALETTE CHECKER</text>
</svg>
