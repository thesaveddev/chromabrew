<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="40%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <style>
      .inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#0a0a0a"/>
  <rect width="1080" height="1350" fill="url(#glow1)"/>

  <!-- Logo -->
  <rect x="72" y="72" width="48" height="48" rx="12" fill="#18181b"/>
  <circle cx="96" cy="96" r="9" fill="#c87cb3"/>
  <text x="136" y="102" fill="#fafafa" font-size="20" font-weight="700" class="inter" letter-spacing="-0.5">ChromaBrew</text>
  <text x="1008" y="100" text-anchor="end" fill="#525252" font-size="12" font-weight="500" class="mono" letter-spacing="2">DAY 07</text>

  <!-- Hero -->
  <text x="72" y="220" fill="#fafafa" font-size="68" font-weight="900" class="inter" letter-spacing="-3">Design tokens.</text>
  <text x="72" y="296" font-size="68" font-weight="900" class="inter" letter-spacing="-3">
    <tspan fill="url(#accentGrad)">DTCG format.</tspan>
  </text>
  <text x="72" y="370" fill="#fafafa" font-size="68" font-weight="900" class="inter" letter-spacing="-3">Production ready.</text>

  <!-- Token structure -->
  <g transform="translate(72, 420)">
    <rect x="0" y="0" width="936" height="420" rx="16" fill="#171717" stroke="#262626" stroke-width="1"/>
    <rect x="0" y="0" width="936" height="40" rx="16" fill="#1e1e1e"/>
    <rect x="0" y="24" width="936" height="16" fill="#1e1e1e"/>
    <circle cx="24" cy="20" r="6" fill="#ef4444"/>
    <circle cx="44" cy="20" r="6" fill="#eab308"/>
    <circle cx="64" cy="20" r="6" fill="#22c55e"/>
    <text x="120" y="25" fill="#525252" font-size="12" class="mono">tokens.json</text>

    <!-- JSON tree -->
    <text x="24" y="72" fill="#e06c75" font-size="14" class="mono">{</text>
    <text x="24" y="96" fill="#e06c75" font-size="14" class="mono">  "color": {</text>
    <text x="24" y="120" fill="#e06c75" font-size="14" class="mono">    "primitive": {</text>
    <text x="24" y="144" fill="#e06c75" font-size="14" class="mono">      "brand": {</text>
    <text x="48" y="168" fill="#c678dd" font-size="14" class="mono">"50":  {</text>
    <text x="220" y="168" fill="#98c379" font-size="14" class="mono">"value": "#eff6ff"</text>
    <text x="480" y="168" fill="#e06c75" font-size="14" class="mono">},</text>
    <text x="48" y="192" fill="#c678dd" font-size="14" class="mono">"500": {</text>
    <text x="220" y="192" fill="#98c379" font-size="14" class="mono">"value": "#3a86ff"</text>
    <text x="480" y="192" fill="#e06c75" font-size="14" class="mono">},</text>
    <text x="48" y="216" fill="#c678dd" font-size="14" class="mono">"950": {</text>
    <text x="220" y="216" fill="#98c379" font-size="14" class="mono">"value": "#172554"</text>
    <text x="480" y="216" fill="#e06c75" font-size="14" class="mono">}</text>
    <text x="24" y="240" fill="#e06c75" font-size="14" class="mono">      }</text>
    <text x="24" y="264" fill="#e06c75" font-size="14" class="mono">    },</text>
    <text x="24" y="288" fill="#e06c75" font-size="14" class="mono">    "semantic": {</text>
    <text x="48" y="312" fill="#c678dd" font-size="14" class="mono">"background": {</text>
    <text x="250" y="312" fill="#98c379" font-size="14" class="mono">"value": "{color.primitive.brand.50}"</text>
    <text x="700" y="312" fill="#e06c75" font-size="14" class="mono">}</text>
    <text x="48" y="336" fill="#c678dd" font-size="14" class="mono">"foreground": {</text>
    <text x="250" y="336" fill="#98c379" font-size="14" class="mono">"value": "{color.primitive.brand.950}"</text>
    <text x="700" y="336" fill="#e06c75" font-size="14" class="mono">}</text>
    <text x="24" y="360" fill="#e06c75" font-size="14" class="mono">    }</text>
    <text x="24" y="384" fill="#e06c75" font-size="14" class="mono">  }</text>
    <text x="24" y="408" fill="#e06c75" font-size="14" class="mono">}</text>
  </g>

  <!-- Bottom -->
  <text x="72" y="1280" fill="#fafafa" font-size="20" font-weight="600" class="inter" letter-spacing="-0.3">chromabrew.com</text>
  <text x="1008" y="1280" text-anchor="end" fill="#525252" font-size="11" class="mono">DESIGN TOKEN GENERATOR</text>
</svg>
