<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <style>
      .inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#0a0a0a"/>
  <rect width="1080" height="1350" fill="url(#glow1)"/>

  <!-- Logo -->
  <rect x="72" y="72" width="48" height="48" rx="12" fill="#18181b"/>
  <circle cx="96" cy="96" r="9" fill="#c87cb3"/>
  <text x="136" y="102" fill="#fafafa" font-size="20" font-weight="700" class="inter" letter-spacing="-0.5">ChromaBrew</text>

  <!-- Hero -->
  <text x="72" y="240" fill="#ef4444" font-size="120" font-weight="900" class="mono" letter-spacing="-4">8%</text>
  <text x="72" y="310" fill="#fafafa" font-size="48" font-weight="700" class="inter" letter-spacing="-1">of men are color blind.</text>
  <text x="72" y="370" fill="#737373" font-size="24" font-weight="400" class="inter">Is your UI excluding them?</text>

  <!-- CVD simulation preview -->
  <g transform="translate(72, 430)">
    <!-- Normal vision -->
    <rect x="0" y="0" width="210" height="180" rx="12" fill="#171717" stroke="#262626" stroke-width="1"/>
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#22c55e"/>
    <rect x="64" y="16" width="40" height="40" rx="8" fill="#ef4444"/>
    <rect x="112" y="16" width="40" height="40" rx="8" fill="#3b82f6"/>
    <rect x="16" y="68" width="180" height="12" rx="4" fill="#262626"/>
    <rect x="16" y="88" width="140" height="12" rx="4" fill="#262626"/>
    <rect x="16" y="120" width="80" height="28" rx="6" fill="#22c55e"/>
    <text x="56" y="139" text-anchor="middle" fill="white" font-size="10" font-weight="600" class="inter">Success</text>
    <rect x="108" y="120" width="80" height="28" rx="6" fill="#ef4444"/>
    <text x="148" y="139" text-anchor="middle" fill="white" font-size="10" font-weight="600" class="inter">Danger</text>
    <text x="105" y="170" text-anchor="middle" fill="#525252" font-size="10" class="mono">NORMAL</text>

    <!-- Protanopia -->
    <rect x="226" y="0" width="210" height="180" rx="12" fill="#171717" stroke="#262626" stroke-width="1"/>
    <rect x="242" y="16" width="40" height="40" rx="8" fill="#9e9e3e"/>
    <rect x="290" y="16" width="40" height="40" rx="8" fill="#a08030"/>
    <rect x="338" y="16" width="40" height="40" rx="8" fill="#3b82f6"/>
    <rect x="242" y="68" width="180" height="12" rx="4" fill="#262626"/>
    <rect x="242" y="88" width="140" height="12" rx="4" fill="#262626"/>
    <rect x="242" y="120" width="80" height="28" rx="6" fill="#9e9e3e"/>
    <text x="282" y="139" text-anchor="middle" fill="white" font-size="10" font-weight="600" class="inter">Success</text>
    <rect x="334" y="120" width="80" height="28" rx="6" fill="#a08030"/>
    <text x="374" y="139" text-anchor="middle" fill="white" font-size="10" font-weight="600" class="inter">Danger</text>
    <text x="331" y="170" text-anchor="middle" fill="#525252" font-size="10" class="mono">PROTANOPIA</text>

    <!-- Deuteranopia -->
    <rect x="452" y="0" width="210" height="180" rx="12" fill="#171717" stroke="#262626" stroke-width="1"/>
    <rect x="468" y="16" width="40" height="40" rx="8" fill="#a09040"/>
    <rect x="516" y="16" width="40" height="40" rx="8" fill="#a07028"/>
    <rect x="564" y="16" width="40" height="40" rx="8" fill="#3b82f6"/>
    <rect x="468" y="68" width="180" height="12" rx="4" fill="#262626"/>
    <rect x="468" y="88" width="140" height="12" rx="4" fill="#262626"/>
    <rect x="468" y="120" width="80" height="28" rx="6" fill="#a09040"/>
    <text x="508" y="139" text-anchor="middle" fill="white" font-size="10" font-weight="600" class="inter">Success</text>
    <rect x="560" y="120" width="80" height="28" rx="6" fill="#a07028"/>
    <text x="600" y="139" text-anchor="middle" fill="white" font-size="10" font-weight="600" class="inter">Danger</text>
    <text x="557" y="170" text-anchor="middle" fill="#525252" font-size="10" class="mono">DEUTERANOPIA</text>

    <!-- Tritanopia -->
    <rect x="678" y="0" width="210" height="180" rx="12" fill="#171717" stroke="#262626" stroke-width="1"/>
    <rect x="694" y="16" width="40" height="40" rx="8" fill="#22c55e"/>
    <rect x="742" y="16" width="40" height="40" rx="8" fill="#c04040"/>
    <rect x="790" y="16" width="40" height="40" rx="8" fill="#808080"/>
    <rect x="694" y="68" width="180" height="12" rx="4" fill="#262626"/>
    <rect x="694" y="88" width="140" height="12" rx="4" fill="#262626"/>
    <rect x="694" y="120" width="80" height="28" rx="6" fill="#22c55e"/>
    <text x="734" y="139" text-anchor="middle" fill="white" font-size="10" font-weight="600" class="inter">Success</text>
    <rect x="786" y="120" width="80" height="28" rx="6" fill="#c04040"/>
    <text x="826" y="139" text-anchor="middle" fill="white" font-size="10" font-weight="600" class="inter">Danger</text>
    <text x="783" y="170" text-anchor="middle" fill="#525252" font-size="10" class="mono">TRITANOPIA</text>
  </g>

  <text x="72" y="680" fill="#fafafa" font-size="26" font-weight="700" class="inter" letter-spacing="-0.5">Simulate protanopia, deuteranopia, tritanopia.</text>
  <text x="72" y="716" fill="#737373" font-size="16" class="inter">Machado et al. (2009) matrices — same as major a11y tools.</text>

  <!-- Bottom -->
  <text x="72" y="1280" fill="#fafafa" font-size="20" font-weight="600" class="inter" letter-spacing="-0.3">chromabrew.com</text>
  <text x="1008" y="1280" text-anchor="end" fill="#525252" font-size="11" class="mono">COLOR BLINDNESS SIMULATOR</text>
</svg>
