<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <style>
      .inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#0a0a0a"/>
  <rect width="1080" height="1350" fill="url(#glow1)"/>

  <!-- Logo -->
  <rect x="72" y="72" width="48" height="48" rx="12" fill="#18181b"/>
  <circle cx="96" cy="96" r="9" fill="#c87cb3"/>
  <text x="136" y="102" fill="#fafafa" font-size="20" font-weight="700" class="inter" letter-spacing="-0.5">ChromaBrew</text>
  <text x="1008" y="100" text-anchor="end" fill="#525252" font-size="12" font-weight="500" class="mono" letter-spacing="2">DAY 04</text>

  <!-- Hero -->
  <text x="72" y="220" fill="#fafafa" font-size="72" font-weight="900" class="inter" letter-spacing="-3">Tailwind v4</text>
  <text x="72" y="300" font-size="72" font-weight="900" class="inter" letter-spacing="-3">
    <tspan fill="url(#accentGrad)">@theme</tspan>
  </text>
  <text x="72" y="378" fill="#fafafa" font-size="72" font-weight="900" class="inter" letter-spacing="-3">in one click.</text>

  <!-- Code block -->
  <g transform="translate(72, 430)">
    <rect x="0" y="0" width="936" height="340" rx="16" fill="#171717" stroke="#262626" stroke-width="1"/>
    <rect x="0" y="0" width="936" height="40" rx="16" fill="#1e1e1e"/>
    <rect x="0" y="24" width="936" height="16" fill="#1e1e1e"/>
    <circle cx="24" cy="20" r="6" fill="#ef4444"/>
    <circle cx="44" cy="20" r="6" fill="#eab308"/>
    <circle cx="64" cy="20" r="6" fill="#22c55e"/>
    <text x="120" y="25" fill="#525252" font-size="12" class="mono">globals.css</text>

    <text x="24" y="76" fill="#c678dd" font-size="14" class="mono">@theme</text>
    <text x="24" y="100" fill="#e06c75" font-size="14" class="mono">  --color-brand-50:</text>
    <text x="260" y="100" fill="#98c379" font-size="14" class="mono">#eff6ff;</text>
    <text x="24" y="120" fill="#e06c75" font-size="14" class="mono">  --color-brand-100:</text>
    <text x="260" y="120" fill="#98c379" font-size="14" class="mono">#dbeafe;</text>
    <text x="24" y="140" fill="#e06c75" font-size="14" class="mono">  --color-brand-200:</text>
    <text x="260" y="140" fill="#98c379" font-size="14" class="mono">#bfdbfe;</text>
    <text x="24" y="160" fill="#e06c75" font-size="14" class="mono">  --color-brand-300:</text>
    <text x="260" y="160" fill="#98c379" font-size="14" class="mono">#93c5fd;</text>
    <text x="24" y="180" fill="#e06c75" font-size="14" class="mono">  --color-brand-400:</text>
    <text x="260" y="180" fill="#98c379" font-size="14" class="mono">#60a5fa;</text>
    <text x="24" y="200" fill="#e06c75" font-size="14" class="mono">  --color-brand-500:</text>
    <text x="260" y="200" fill="#98c379" font-size="14" class="mono">#3a86ff;</text>
    <text x="24" y="220" fill="#e06c75" font-size="14" class="mono">  --color-brand-600:</text>
    <text x="260" y="220" fill="#98c379" font-size="14" class="mono">#2563eb;</text>
    <text x="24" y="240" fill="#e06c75" font-size="14" class="mono">  --color-brand-700:</text>
    <text x="260" y="240" fill="#98c379" font-size="14" class="mono">#1d4ed8;</text>
    <text x="24" y="260" fill="#e06c75" font-size="14" class="mono">  --color-brand-800:</text>
    <text x="260" y="260" fill="#98c379" font-size="14" class="mono">#1e40af;</text>
    <text x="24" y="280" fill="#e06c75" font-size="14" class="mono">  --color-brand-900:</text>
    <text x="260" y="280" fill="#98c379" font-size="14" class="mono">#1e3a8a;</text>
    <text x="24" y="300" fill="#e06c75" font-size="14" class="mono">  --color-brand-950:</text>
    <text x="260" y="300" fill="#98c379" font-size="14" class="mono">#172554;</text>
  </g>

  <text x="72" y="820" fill="#737373" font-size="17" class="inter">Paste. Use bg-brand-600, text-brand-400. Done.</text>

  <!-- Badge -->
  <rect x="72" y="868" width="380" height="48" rx="100" fill="#171717" stroke="#262626" stroke-width="1"/>
  <circle cx="100" cy="892" r="5" fill="#22c55e"/>
  <text x="118" y="897" fill="#a3a3a3" font-size="13" font-weight="500" class="inter">Perceptual OKLCH 50–950 scale</text>

  <!-- Bottom -->
  <text x="72" y="1280" fill="#fafafa" font-size="20" font-weight="600" class="inter" letter-spacing="-0.3">chromabrew.com</text>
  <text x="1008" y="1280" text-anchor="end" fill="#525252" font-size="11" class="mono">TAILWIND GENERATOR</text>
</svg>
