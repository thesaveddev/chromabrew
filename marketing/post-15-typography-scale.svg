<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c87cb3"/>
      <stop offset="100%" stop-color="#3a86ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#3a86ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3a86ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#0a0a0a"/>
  <rect width="1080" height="1350" fill="url(#glow1)"/>

  <!-- Logo -->
  <rect x="72" y="72" width="56" height="56" rx="14" fill="#18181b"/>
  <circle cx="100" cy="100" r="11" fill="#c87cb3"/>
  <text x="144" y="108" fill="#fafafa" font-size="24" font-weight="700" class="inter" letter-spacing="-0.5">ChromaBrew</text>
  <text x="1008" y="100" text-anchor="end" fill="#525252" font-size="13" font-weight="500" class="mono" letter-spacing="2">TYPOGRAPHY</text>

  <!-- Hero -->
  <text x="72" y="236" fill="#fafafa" font-size="76" font-weight="900" class="inter" letter-spacing="-3">Build a type</text>
  <text x="72" y="318" font-size="76" font-weight="900" class="inter" letter-spacing="-3">
    <tspan fill="url(#accentGrad)">scale.</tspan>
  </text>
  <text x="72" y="380" fill="#737373" font-size="20" class="inter" letter-spacing="-0.2">One base size × a constant ratio</text>
  <text x="72" y="410" fill="#737373" font-size="20" class="inter" letter-spacing="-0.2">= every step of your scale.</text>

  <!-- Type scale visualization -->
  <g transform="translate(72, 460)">
    <!-- Labels -->
    <g transform="translate(0, 0)">
      <text x="0" y="18" fill="#525252" font-size="12" font-weight="500" class="mono" letter-spacing="1.5">COMPACT 1.200</text>
      <rect x="260" y="0" width="180" height="26" rx="6" fill="#3a86ff"/>
      <text x="350" y="18" text-anchor="middle" fill="#0a0a0a" font-size="12" font-weight="700" class="mono">APP · DASHBOARD</text>
    </g>
    <!-- steps -->
    <text x="0" y="70" fill="#a3a3a3" font-size="20" class="mono">xs</text>
    <text x="120" y="70" fill="#fafafa" font-size="20" font-weight="600" class="inter">Captions</text>
    <text x="0" y="112" fill="#a3a3a3" font-size="24" class="mono">base</text>
    <text x="120" y="112" fill="#fafafa" font-size="26" font-weight="600" class="inter">Body copy sits here</text>
    <text x="0" y="160" fill="#a3a3a3" font-size="26" class="mono">lg</text>
    <text x="120" y="160" fill="#fafafa" font-size="32" font-weight="600" class="inter">Lead paragraphs</text>
    <text x="0" y="216" fill="#a3a3a3" font-size="30" class="mono">2xl</text>
    <text x="120" y="216" fill="#fafafa" font-size="40" font-weight="700" class="inter">Card headings</text>
    <text x="0" y="280" fill="#a3a3a3" font-size="34" class="mono">4xl</text>
    <text x="120" y="280" fill="#fafafa" font-size="52" font-weight="800" class="inter">Section headers</text>
    <text x="0" y="356" fill="#a3a3a3" font-size="38" class="mono">5xl</text>
    <text x="120" y="356" fill="#fafafa" font-size="64" font-weight="900" class="inter">Display type</text>
  </g>

  <!-- Ratio card -->
  <g transform="translate(620, 1160)">
    <rect x="-20" y="-30" width="428" height="120" rx="16" fill="#131316" stroke="#262626" stroke-width="1"/>
    <text x="0" y="0" fill="#a3a3a3" font-size="14" class="mono">1.200</text>
    <text x="0" y="28" fill="#a3a3a3" font-size="14" class="mono">1.250</text>
    <text x="0" y="56" fill="#a3a3a3" font-size="14" class="mono">1.333</text>
  </g>

  <!-- Tagline -->
  <text x="72" y="1120" fill="#fafafa" font-size="28" font-weight="700" class="inter" letter-spacing="-1">Steep ratio = bold landing page.</text>
  <text x="72" y="1154" fill="#fafafa" font-size="28" font-weight="700" class="inter" letter-spacing="-1">Gentle = dense, text-heavy app.</text>

  <!-- Badge -->
  <rect x="72" y="1210" width="430" height="48" rx="100" fill="#171717" stroke="#262626" stroke-width="1"/>
  <circle cx="100" cy="1234" r="5" fill="#22c55e"/>
  <text x="118" y="1239" fill="#a3a3a3" font-size="13" font-weight="500" class="inter">New free tool — no sign-up needed</text>

  <!-- Bottom -->
  <text x="72" y="1300" fill="#fafafa" font-size="20" font-weight="600" class="inter" letter-spacing="-0.3">chromabrew.com</text>
  <text x="1008" y="1300" text-anchor="end" fill="#525252" font-size="11" class="mono">TYPE SCALE GENERATOR</text>
</svg>
