<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <style>
      .inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#0a0a0a"/>
  <rect width="1080" height="1350" fill="url(#glow1)"/>

  <!-- Logo -->
  <rect x="72" y="72" width="48" height="48" rx="12" fill="#18181b"/>
  <circle cx="96" cy="96" r="9" fill="#c87cb3"/>
  <text x="136" y="102" fill="#fafafa" font-size="20" font-weight="700" class="inter" letter-spacing="-0.5">ChromaBrew</text>
  <text x="1008" y="100" text-anchor="end" fill="#525252" font-size="12" font-weight="500" class="mono" letter-spacing="2">DAY 06</text>

  <!-- Hero -->
  <text x="72" y="220" fill="#fafafa" font-size="72" font-weight="900" class="inter" letter-spacing="-3">Steal any</text>
  <text x="72" y="300" fill="#fafafa" font-size="72" font-weight="900" class="inter" letter-spacing="-3">palette from</text>
  <text x="72" y="380" font-size="72" font-weight="900" class="inter" letter-spacing="-3">
    <tspan fill="url(#accentGrad)">a photo.</tspan>
  </text>

  <!-- Image preview mockup -->
  <g transform="translate(72, 440)">
    <rect x="0" y="0" width="936" height="360" rx="16" fill="#171717" stroke="#262626" stroke-width="1"/>

    <!-- Photo placeholder with color blocks -->
    <rect x="16" y="16" width="460" height="328" rx="12" fill="#1a1a2e"/>
    <rect x="16" y="16" width="460" height="120" rx="12" fill="#16213e"/>
    <rect x="16" y="136" width="460" height="120" fill="#0f3460"/>
    <rect x="16" y="256" width="460" height="88" rx="12" fill="#e94560"/>
    <!-- Sunset gradient overlay -->
    <rect x="16" y="16" width="460" height="328" rx="12" fill="url(#sunsetGrad)" opacity="0.4"/>

    <!-- Extracted palette -->
    <rect x="500" y="40" width="412" height="52" rx="10" fill="#16213e"/>
    <text x="520" y="72" fill="#a3a3a3" font-size="12" font-weight="500" class="mono">#16213e — Midnight</text>

    <rect x="500" y="104" width="412" height="52" rx="10" fill="#0f3460"/>
    <text x="520" y="136" fill="#a3a3a3" font-size="12" font-weight="500" class="mono">#0f3460 — Deep Blue</text>

    <rect x="500" y="168" width="412" height="52" rx="10" fill="#e94560"/>
    <text x="520" y="200" fill="#a3a3a3" font-size="12" font-weight="500" class="mono">#e94560 — Coral Red</text>

    <rect x="500" y="232" width="412" height="52" rx="10" fill="#533483"/>
    <text x="520" y="264" fill="#a3a3a3" font-size="12" font-weight="500" class="mono">#533483 — Violet</text>

    <rect x="500" y="296" width="412" height="52" rx="10" fill="#f8b500"/>
    <text x="520" y="328" fill="#a3a3a3" font-size="12" font-weight="500" class="mono">#f8b500 — Amber</text>
  </g>

  <text x="72" y="860" fill="#fafafa" font-size="26" font-weight="700" class="inter" letter-spacing="-0.5">Drag. Drop. Get HEX, RGB, CSS variables.</text>
  <text x="72" y="896" fill="#737373" font-size="16" class="inter">Median-cut algorithm. Runs entirely in your browser.</text>

  <!-- Bottom -->
  <text x="72" y="1280" fill="#fafafa" font-size="20" font-weight="600" class="inter" letter-spacing="-0.3">chromabrew.com</text>
  <text x="1008" y="1280" text-anchor="end" fill="#525252" font-size="11" class="mono">IMAGE COLOR EXTRACTOR</text>
</svg>
