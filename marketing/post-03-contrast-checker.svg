<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#3a86ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="70%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <style>
      .inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#0a0a0a"/>
  <rect width="1080" height="1350" fill="url(#glow1)"/>

  <!-- Logo -->
  <rect x="72" y="72" width="48" height="48" rx="12" fill="#18181b"/>
  <circle cx="96" cy="96" r="9" fill="#c87cb3"/>
  <text x="136" y="102" fill="#fafafa" font-size="20" font-weight="700" class="inter" letter-spacing="-0.5">ChromaBrew</text>
  <text x="1008" y="100" text-anchor="end" fill="#525252" font-size="12" font-weight="500" class="mono" letter-spacing="2">DAY 02</text>

  <!-- Hero -->
  <text x="72" y="220" fill="#fafafa" font-size="74" font-weight="900" class="inter" letter-spacing="-3">Does your</text>
  <text x="72" y="300" fill="#fafafa" font-size="74" font-weight="900" class="inter" letter-spacing="-3">UI pass</text>
  <text x="72" y="380" font-size="74" font-weight="900" class="inter" letter-spacing="-3">
    <tspan fill="url(#accentGrad)">WCAG?</tspan>
  </text>

  <!-- Contrast ratio visual -->
  <g transform="translate(72, 440)">
    <!-- Large ratio display -->
    <rect x="0" y="0" width="360" height="200" rx="16" fill="#171717" stroke="#262626" stroke-width="1"/>
    <text x="36" y="60" fill="#525252" font-size="12" font-weight="500" class="mono" letter-spacing="1">CONTRAST RATIO</text>
    <text x="36" y="120" fill="#22c55e" font-size="72" font-weight="900" class="mono" letter-spacing="-2">7.2:1</text>
    <text x="36" y="160" fill="#a3a3a3" font-size="16" font-weight="500" class="inter">Normal text — AAA ✓</text>

    <!-- Grade badges -->
    <rect x="400" y="0" width="300" height="94" rx="12" fill="#171717" stroke="#22c55e" stroke-width="1.5"/>
    <text x="436" y="40" fill="#22c55e" font-size="14" font-weight="600" class="inter">AA Normal ✓</text>
    <text x="436" y="68" fill="#525252" font-size="12" class="mono">4.5:1 required</text>

    <rect x="400" y="106" width="300" height="94" rx="12" fill="#171717" stroke="#22c55e" stroke-width="1.5"/>
    <text x="436" y="146" fill="#22c55e" font-size="14" font-weight="600" class="inter">AAA Normal ✓</text>
    <text x="436" y="174" fill="#525252" font-size="12" class="mono">7:1 required</text>
  </g>

  <!-- Color pairs preview -->
  <g transform="translate(72, 700)">
    <rect x="0" y="0" width="260" height="100" rx="12" fill="#ffffff"/>
    <text x="130" y="55" text-anchor="middle" fill="#171717" font-size="18" font-weight="700" class="inter">White on Dark</text>
    <text x="130" y="78" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="500" class="mono">21:1 AAA ✓</text>

    <rect x="280" y="0" width="260" height="100" rx="12" fill="#171717"/>
    <text x="410" y="55" text-anchor="middle" fill="#fafafa" font-size="18" font-weight="700" class="inter">Light on Black</text>
    <text x="410" y="78" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="500" class="mono">19.8:1 AAA ✓</text>

    <rect x="560" y="0" width="360" height="100" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="740" y="55" text-anchor="middle" fill="#ef4444" font-size="18" font-weight="700" class="inter">Light gray on white</text>
    <text x="740" y="78" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="500" class="mono">1.2:1 Fail ✗</text>
  </g>

  <text x="72" y="860" fill="#737373" font-size="18" font-weight="400" class="inter">Check any two colors. Fix failing pairs instantly.</text>

  <!-- Badge -->
  <rect x="72" y="910" width="440" height="48" rx="100" fill="#171717" stroke="#262626" stroke-width="1"/>
  <circle cx="100" cy="934" r="5" fill="#22c55e"/>
  <text x="118" y="939" fill="#a3a3a3" font-size="13" font-weight="500" class="inter">Auto-fix suggestions — one click to repair</text>

  <!-- Bottom -->
  <text x="72" y="1280" fill="#fafafa" font-size="20" font-weight="600" class="inter" letter-spacing="-0.3">chromabrew.com</text>
  <text x="1008" y="1280" text-anchor="end" fill="#525252" font-size="11" class="mono">CONTRAST CHECKER</text>
</svg>
