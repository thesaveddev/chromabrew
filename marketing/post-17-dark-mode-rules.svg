<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#3a86ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3a86ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#0a0a0a"/>
  <rect width="1080" height="1350" fill="url(#glow1)"/>

  <!-- Logo -->
  <rect x="72" y="72" width="56" height="56" rx="14" fill="#18181b"/>
  <circle cx="100" cy="100" r="11" fill="#c87cb3"/>
  <text x="144" y="108" fill="#fafafa" font-size="24" font-weight="700" class="inter" letter-spacing="-0.5">ChromaBrew</text>
  <text x="1008" y="100" text-anchor="end" fill="#525252" font-size="13" font-weight="500" class="mono" letter-spacing="2">DARK MODE</text>

  <!-- Hero -->
  <text x="72" y="236" fill="#fafafa" font-size="76" font-weight="900" class="inter" letter-spacing="-3">Dark mode</text>
  <text x="72" y="318" font-size="76" font-weight="900" class="inter" letter-spacing="-3">
    <tspan fill="url(#accentGrad)">isn't inverted.</tspan>
  </text>
  <text x="72" y="380" fill="#737373" font-size="20" class="inter" letter-spacing="-0.2">Don't just flip the brightness.</text>
  <text x="72" y="410" fill="#737373" font-size="20" class="inter" letter-spacing="-0.2">Build it with semantic tokens instead.</text>

  <!-- Elevation diagram -->
  <g transform="translate(72, 470)">
    <!-- Naive -->
    <text x="0" y="0" fill="#f87171" font-size="13" font-weight="600" class="mono" letter-spacing="1">❌ INVERTED</text>
    <rect x="0" y="16" width="440" height="120" rx="12" fill="#111111"/>
    <rect x="20" y="36" width="400" height="80" rx="10" fill="#0c0c0c"/>
    <text x="20" y="58" fill="#f87171" font-size="14" class="mono">surface DARKER than page</text>
    <text x="20" y="82" fill="#525252" font-size="12" class="inter">Flips backwards — cards sink into the bg.</text>

    <!-- Correct -->
    <text x="520" y="0" fill="#4ade80" font-size="13" font-weight="600" class="mono" letter-spacing="1">✓ ELEVATION</text>
    <rect x="520" y="16" width="440" height="120" rx="12" fill="#0c0c0c"/>
    <rect x="540" y="36" width="400" height="80" rx="10" fill="#1a1a1a"/>
    <text x="540" y="58" fill="#4ade80" font-size="14" class="mono">surface LIGHTER than page</text>
    <text x="540" y="82" fill="#525252" font-size="12" class="inter">Raised layers go lighter in the dark.</text>
  </g>

  <!-- Movement arrow -->
  <text x="504" y="560" fill="#fafafa" font-size="26" class="inter">→</text>

  <!-- Token hint -->
  <g transform="translate(72, 680)">
    <rect x="0" y="0" width="936" height="120" rx="16" fill="#131316" stroke="#262626" stroke-width="1"/>
    <text x="30" y="42" fill="#fafafa" font-size="16" font-weight="600" class="mono">--color-background</text>
    <text x="320" y="42" fill="#a3a3a3" font-size="16" class="mono">#0a0a0a</text>
    <text x="30" y="80" fill="#fafafa" font-size="16" font-weight="600" class="mono">--color-surface</text>
    <text x="320" y="80" fill="#a3a3a3" font-size="16" class="mono">#1a1a1a</text>
    <text x="560" y="80" fill="#525252" font-size="13" class="inter">Same tokens, two themes.</text>
  </g>

  <!-- Tagline -->
  <text x="72" y="900" fill="#fafafa" font-size="30" font-weight="700" class="inter" letter-spacing="-1">One source of truth.</text>
  <text x="72" y="936" fill="#fafafa" font-size="30" font-weight="700" class="inter" letter-spacing="-1">Light + dark, both accessible.</text>
  <text x="72" y="980" fill="#737373" font-size="18" class="inter">Generated from your brand color — no manual theming.</text>

  <!-- Badge -->
  <rect x="72" y="1020" width="430" height="48" rx="100" fill="#171717" stroke="#262626" stroke-width="1"/>
  <circle cx="100" cy="1044" r="5" fill="#22c55e"/>
  <text x="118" y="1049" fill="#a3a3a3" font-size="13" font-weight="500" class="inter">Free — semantic themes in your browser</text>

  <!-- Bottom -->
  <text x="72" y="1280" fill="#fafafa" font-size="20" font-weight="600" class="inter" letter-spacing="-0.3">chromabrew.com</text>
  <text x="1008" y="1280" text-anchor="end" fill="#525252" font-size="11" class="mono">DARK MODE GENERATOR</text>
</svg>
