<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#a3a3a3"/>
    </linearGradient>
    <radialGradient id="glow1" cx="60%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#fafafa" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fafafa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#0a0a0a"/>
  <rect width="1080" height="1350" fill="url(#glow1)"/>

  <!-- Logo -->
  <rect x="72" y="72" width="48" height="48" rx="12" fill="#18181b"/>
  <circle cx="96" cy="96" r="9" fill="#c87cb3"/>
  <text x="136" y="102" fill="#fafafa" font-size="20" font-weight="700" class="inter" letter-spacing="-0.5">ChromaBrew</text>
  <text x="1008" y="100" text-anchor="end" fill="#525252" font-size="12" font-weight="500" class="mono" letter-spacing="2">DAY 05</text>

  <!-- Hero -->
  <text x="72" y="220" fill="#fafafa" font-size="72" font-weight="900" class="inter" letter-spacing="-3">shadcn/ui</text>
  <text x="72" y="300" font-size="72" font-weight="900" class="inter" letter-spacing="-3">
    <tspan fill="url(#accentGrad)">themes</tspan>
  </text>
  <text x="72" y="378" fill="#fafafa" font-size="72" font-weight="900" class="inter" letter-spacing="-3">that work.</text>

  <!-- Theme preview cards -->
  <g transform="translate(72, 430)">
    <!-- Light theme card -->
    <rect x="0" y="0" width="440" height="360" rx="16" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <rect x="24" y="24" width="392" height="32" rx="8" fill="#f5f5f5"/>
    <text x="44" y="46" fill="#171717" font-size="12" font-weight="600" class="mono">root</text>

    <rect x="24" y="72" width="100" height="32" rx="8" fill="#171717"/>
    <text x="74" y="93" text-anchor="middle" fill="white" font-size="11" font-weight="600" class="inter">Primary</text>

    <rect x="136" y="72" width="100" height="32" rx="8" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="1"/>
    <text x="186" y="93" text-anchor="middle" fill="#171717" font-size="11" font-weight="600" class="inter">Secondary</text>

    <rect x="248" y="72" width="100" height="32" rx="8" fill="#3a86ff"/>
    <text x="298" y="93" text-anchor="middle" fill="white" font-size="11" font-weight="600" class="inter">Accent</text>

    <rect x="24" y="120" width="392" height="60" rx="8" fill="#f5f5f5"/>
    <rect x="40" y="136" width="160" height="12" rx="4" fill="#e5e5e5"/>
    <rect x="40" y="156" width="240" height="12" rx="4" fill="#e5e5e5"/>

    <rect x="24" y="196" width="392" height="60" rx="8" fill="#fafafa" border="none"/>
    <rect x="40" y="212" width="140" height="12" rx="4" fill="#e5e5e5"/>
    <rect x="40" y="232" width="200" height="12" rx="4" fill="#e5e5e5"/>

    <text x="24" y="300" fill="#525252" font-size="11" class="mono">LIGHT THEME</text>

    <!-- Dark theme card -->
    <rect x="468" y="0" width="440" height="360" rx="16" fill="#0a0a0a" stroke="#262626" stroke-width="1"/>
    <rect x="492" y="24" width="392" height="32" rx="8" fill="#171717"/>
    <text x="512" y="46" fill="#fafafa" font-size="12" font-weight="600" class="mono">.dark</text>

    <rect x="492" y="72" width="100" height="32" rx="8" fill="#3a86ff"/>
    <text x="542" y="93" text-anchor="middle" fill="white" font-size="11" font-weight="600" class="inter">Primary</text>

    <rect x="604" y="72" width="100" height="32" rx="8" fill="#262626"/>
    <text x="654" y="93" text-anchor="middle" fill="#fafafa" font-size="11" font-weight="600" class="inter">Secondary</text>

    <rect x="716" y="72" width="100" height="32" rx="8" fill="#ff006e"/>
    <text x="766" y="93" text-anchor="middle" fill="white" font-size="11" font-weight="600" class="inter">Accent</text>

    <rect x="492" y="120" width="392" height="60" rx="8" fill="#171717"/>
    <rect x="508" y="136" width="160" height="12" rx="4" fill="#262626"/>
    <rect x="508" y="156" width="240" height="12" rx="4" fill="#262626"/>

    <rect x="492" y="196" width="392" height="60" rx="8" fill="#0a0a0a"/>
    <rect x="508" y="212" width="140" height="12" rx="4" fill="#262626"/>
    <rect x="508" y="232" width="200" height="12" rx="4" fill="#262626"/>

    <text x="492" y="300" fill="#525252" font-size="11" class="mono">DARK THEME</text>
  </g>

  <text x="72" y="840" fill="#fafafa" font-size="26" font-weight="700" class="inter" letter-spacing="-0.5">Current oklch() format. Charts. Sidebar tokens.</text>
  <text x="72" y="876" fill="#737373" font-size="16" class="inter">Paste into globals.css. Every component picks it up.</text>

  <!-- Bottom -->
  <text x="72" y="1280" fill="#fafafa" font-size="20" font-weight="600" class="inter" letter-spacing="-0.3">chromabrew.com</text>
  <text x="1008" y="1280" text-anchor="end" fill="#525252" font-size="11" class="mono">SHADCN/UI GENERATOR</text>
</svg>
