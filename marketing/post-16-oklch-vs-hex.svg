<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff006e"/>
      <stop offset="100%" stop-color="#8338ec"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#8338ec" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8338ec" stop-opacity="0"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#0a0a0a"/>
  <rect width="1080" height="1350" fill="url(#glow1)"/>

  <!-- Logo -->
  <rect x="72" y="72" width="56" height="56" rx="14" fill="#18181b"/>
  <circle cx="100" cy="100" r="11" fill="#c87cb3"/>
  <text x="144" y="108" fill="#fafafa" font-size="24" font-weight="700" class="inter" letter-spacing="-0.5">ChromaBrew</text>
  <text x="1008" y="100" text-anchor="end" fill="#525252" font-size="13" font-weight="500" class="mono" letter-spacing="2">SCALES</text>

  <!-- Hero -->
  <text x="72" y="236" fill="#fafafa" font-size="76" font-weight="900" class="inter" letter-spacing="-3">Uneven</text>
  <text x="72" y="318" fill="#fafafa" font-size="76" font-weight="900" class="inter" letter-spacing="-3">vs</text>
  <text x="72" y="400" font-size="76" font-weight="900" class="inter" letter-spacing="-3">
    <tspan fill="url(#accentGrad)">perceptual.</tspan>
  </text>
  <text x="72" y="462" fill="#737373" font-size="20" class="inter" letter-spacing="-0.2">Why your shade scale looks "off" —</text>
  <text x="72" y="492" fill="#737373" font-size="20" class="inter" letter-spacing="-0.2">and why OKLCH fixes it.</text>

  <!-- Two strips: naive HEX vs OKLCH -->
  <!-- Naive HEX (stepping hex digits) -->
  <g transform="translate(72, 540)">
    <text x="0" y="0" fill="#f87171" font-size="13" font-weight="600" class="mono" letter-spacing="1">STEPPING HEX — UNEVEN</text>
    <rect x="0" y="14" width="180" height="66" rx="10" fill="#eff6ff"/>
    <rect x="188" y="14" width="180" height="66" rx="10" fill="#dbeafe"/>
    <rect x="376" y="14" width="180" height="66" rx="10" fill="#93c5fd"/>
    <rect x="564" y="14" width="180" height="66" rx="10" fill="#3a86ff"/>
    <rect x="752" y="14" width="180" height="66" rx="10" fill="#1e3a8a"/>
    <text x="0" y="104" fill="#525252" font-size="12" class="inter">Some steps look identical, then jump wildly.</text>
  </g>

  <!-- Perceptual OKLCH -->
  <g transform="translate(72, 660)">
    <text x="0" y="0" fill="#4ade80" font-size="13" font-weight="600" class="mono" letter-spacing="1">OKLCH — EVENLY SPACED</text>
    <rect x="0" y="14" width="180" height="66" rx="10" fill="#eef5ff"/>
    <rect x="188" y="14" width="180" height="66" rx="10" fill="#d7e8ff"/>
    <rect x="376" y="14" width="180" height="66" rx="10" fill="#8fbaff"/>
    <rect x="564" y="14" width="180" height="66" rx="10" fill="#3a86ff"/>
    <rect x="752" y="14" width="180" height="66" rx="10" fill="#082a80"/>
    <text x="0" y="104" fill="#525252" font-size="12" class="inter">Each step feels the same distance to the eye.</text>
  </g>

  <!-- Tagline -->
  <text x="72" y="892" fill="#fafafa" font-size="30" font-weight="700" class="inter" letter-spacing="-1">The eye doesn't see lightness</text>
  <text x="72" y="928" fill="#fafafa" font-size="30" font-weight="700" class="inter" letter-spacing="-1">linearly. Neither should your scale.</text>

  <!-- Badge -->
  <rect x="72" y="1000" width="430" height="48" rx="100" fill="#171717" stroke="#262626" stroke-width="1"/>
  <circle cx="100" cy="1024" r="5" fill="#22c55e"/>
  <text x="118" y="1029" fill="#a3a3a3" font-size="13" font-weight="500" class="inter">Free — computed in-browser</text>

  <!-- Bottom -->
  <text x="72" y="1280" fill="#fafafa" font-size="20" font-weight="600" class="inter" letter-spacing="-0.3">chromabrew.com</text>
  <text x="1008" y="1280" text-anchor="end" fill="#525252" font-size="11" class="mono">SHADE GENERATOR</text>
</svg>
