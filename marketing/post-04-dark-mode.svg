<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8338ec"/>
      <stop offset="100%" stop-color="#3a86ff"/>
    </linearGradient>
    <linearGradient id="themeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="50%" stop-color="#fafafa"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#8338ec" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8338ec" stop-opacity="0"/>
    </radialGradient>
    <style>
      .inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#0a0a0a"/>
  <rect width="1080" height="1350" fill="url(#glow1)"/>

  <!-- Logo -->
  <rect x="72" y="72" width="48" height="48" rx="12" fill="#18181b"/>
  <circle cx="96" cy="96" r="9" fill="#c87cb3"/>
  <text x="136" y="102" fill="#fafafa" font-size="20" font-weight="700" class="inter" letter-spacing="-0.5">ChromaBrew</text>
  <text x="1008" y="100" text-anchor="end" fill="#525252" font-size="12" font-weight="500" class="mono" letter-spacing="2">DAY 03</text>

  <!-- Hero -->
  <text x="72" y="220" fill="#fafafa" font-size="72" font-weight="900" class="inter" letter-spacing="-3">Never invert</text>
  <text x="72" y="298" font-size="72" font-weight="900" class="inter" letter-spacing="-3">
    <tspan fill="url(#accentGrad)">dark mode</tspan>
  </text>
  <text x="72" y="376" fill="#fafafa" font-size="72" font-weight="900" class="inter" letter-spacing="-3">again.</text>

  <!-- Light/Dark split preview -->
  <g transform="translate(72, 430)">
    <!-- Light side -->
    <rect x="0" y="0" width="456" height="320" rx="16" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <rect x="24" y="24" width="408" height="40" rx="8" fill="#f5f5f5"/>
    <text x="44" y="50" fill="#171717" font-size="14" font-weight="600" class="inter">chromabrew.com</text>
    <rect x="24" y="80" width="200" height="24" rx="4" fill="#3a86ff"/>
    <text x="124" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="600" class="inter">Primary</text>
    <rect x="24" y="116" width="180" height="16" rx="4" fill="#e5e5e5"/>
    <rect x="24" y="140" width="220" height="16" rx="4" fill="#e5e5e5"/>
    <rect x="24" y="164" width="160" height="16" rx="4" fill="#e5e5e5"/>
    <rect x="24" y="200" width="408" height="1" fill="#e5e5e5"/>
    <rect x="24" y="220" width="120" height="36" rx="8" fill="#171717"/>
    <text x="84" y="243" text-anchor="middle" fill="white" font-size="12" font-weight="600" class="inter">Action</text>
    <text x="24" y="290" fill="#525252" font-size="11" class="mono">LIGHT MODE</text>

    <!-- Dark side -->
    <rect x="476" y="0" width="456" height="320" rx="16" fill="#0a0a0a" stroke="#262626" stroke-width="1"/>
    <rect x="500" y="24" width="408" height="40" rx="8" fill="#171717"/>
    <text x="520" y="50" fill="#fafafa" font-size="14" font-weight="600" class="inter">chromabrew.com</text>
    <rect x="500" y="80" width="200" height="24" rx="4" fill="#3a86ff"/>
    <text x="600" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="600" class="inter">Primary</text>
    <rect x="500" y="116" width="180" height="16" rx="4" fill="#262626"/>
    <rect x="500" y="140" width="220" height="16" rx="4" fill="#262626"/>
    <rect x="500" y="164" width="160" height="16" rx="4" fill="#262626"/>
    <rect x="500" y="200" width="408" height="1" fill="#262626"/>
    <rect x="500" y="220" width="120" height="36" rx="8" fill="#3a86ff"/>
    <text x="560" y="243" text-anchor="middle" fill="white" font-size="12" font-weight="600" class="inter">Action</text>
    <text x="500" y="290" fill="#525252" font-size="11" class="mono">DARK MODE</text>
  </g>

  <!-- Semantic tokens -->
  <text x="72" y="810" fill="#fafafa" font-size="28" font-weight="700" class="inter" letter-spacing="-0.5">Semantic tokens, not color inversions.</text>
  <text x="72" y="848" fill="#737373" font-size="17" class="inter">Backgrounds, surfaces, borders, actions — all accessible.</text>

  <!-- Badge -->
  <rect x="72" y="896" width="420" height="48" rx="100" fill="#171717" stroke="#262626" stroke-width="1"/>
  <circle cx="100" cy="920" r="5" fill="#22c55e"/>
  <text x="118" y="925" fill="#a3a3a3" font-size="13" font-weight="500" class="inter">Exports CSS variables + JSON tokens</text>

  <!-- Bottom -->
  <text x="72" y="1280" fill="#fafafa" font-size="20" font-weight="600" class="inter" letter-spacing="-0.3">chromabrew.com</text>
  <text x="1008" y="1280" text-anchor="end" fill="#525252" font-size="11" class="mono">DARK MODE GENERATOR</text>
</svg>
