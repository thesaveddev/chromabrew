<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff006e"/>
      <stop offset="50%" stop-color="#3a86ff"/>
      <stop offset="100%" stop-color="#8338ec"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff006e"/>
      <stop offset="100%" stop-color="#3a86ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#3a86ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3a86ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#ff006e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff006e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="themeChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#0a0a0a"/>

  <!-- Glows -->
  <rect width="1080" height="1350" fill="url(#glow1)"/>
  <rect width="1080" height="1350" fill="url(#glow2)"/>

  <!-- Top bar: Logo + Tag -->
  <!-- Logo mark — exact ChromaBrew favicon -->
  <rect x="72" y="72" width="56" height="56" rx="14" fill="#18181b"/>
  <circle cx="100" cy="100" r="11" fill="#c87cb3"/>

  <!-- Logo text -->
  <text x="144" y="108" fill="#fafafa" font-size="24" font-weight="700" class="inter" letter-spacing="-0.5">ChromaBrew</text>

  <!-- Tag -->
  <text x="1008" y="100" text-anchor="end" fill="#525252" font-size="13" font-weight="500" class="mono" letter-spacing="2">DESIGN SYSTEM GENERATOR</text>

  <!-- Hero heading -->
  <text x="72" y="230" fill="#fafafa" font-size="82" font-weight="900" class="inter" letter-spacing="-3">One color.</text>
  <text x="72" y="318" font-size="82" font-weight="900" class="inter" letter-spacing="-3">
    <tspan fill="url(#accentGrad)">Full system.</tspan>
  </text>

  <!-- Subtitle -->
  <text x="72" y="378" fill="#737373" font-size="20" font-weight="400" class="inter" letter-spacing="-0.2">
    <tspan x="72" dy="0">Turn any brand color into an accessible design</tspan>
    <tspan x="72" dy="30">system — scales, tokens, palettes, dark mode,</tspan>
    <tspan x="72" dy="30">and 17 developer tools. Free, instant, in your browser.</tspan>
  </text>

  <!-- Color transformation strip -->
  <!-- Single color box -->
  <rect x="72" y="510" width="80" height="80" rx="16" fill="#3a86ff"/>
  <rect x="72" y="510" width="80" height="80" rx="16" fill="none" stroke="#3a86ff" stroke-width="0" opacity="0.3"/>
  <text x="112" y="558" text-anchor="middle" fill="white" font-size="12" font-weight="500" class="mono">#3a86ff</text>

  <!-- Arrow -->
  <text x="188" y="562" fill="#404040" font-size="28" class="inter">→</text>

  <!-- Scale swatches (11 swatches, 64px wide, 7px gaps, starting x=240) -->
  <rect x="240" y="510" width="64" height="80" rx="10" fill="#eff6ff"/>
  <text x="272" y="610" text-anchor="middle" fill="#525252" font-size="10" class="mono">50</text>

  <rect x="311" y="510" width="64" height="80" rx="6" fill="#dbeafe"/>
  <text x="343" y="610" text-anchor="middle" fill="#525252" font-size="10" class="mono">100</text>

  <rect x="382" y="510" width="64" height="80" rx="6" fill="#bfdbfe"/>
  <text x="414" y="610" text-anchor="middle" fill="#525252" font-size="10" class="mono">200</text>

  <rect x="453" y="510" width="64" height="80" rx="6" fill="#93c5fd"/>
  <text x="485" y="610" text-anchor="middle" fill="#525252" font-size="10" class="mono">300</text>

  <rect x="524" y="510" width="64" height="80" rx="6" fill="#60a5fa"/>
  <text x="556" y="610" text-anchor="middle" fill="#525252" font-size="10" class="mono">400</text>

  <rect x="595" y="510" width="64" height="80" rx="6" fill="#3a86ff"/>
  <text x="627" y="610" text-anchor="middle" fill="#525252" font-size="10" class="mono">500</text>

  <rect x="666" y="510" width="64" height="80" rx="6" fill="#2563eb"/>
  <text x="698" y="610" text-anchor="middle" fill="#525252" font-size="10" class="mono">600</text>

  <rect x="737" y="510" width="64" height="80" rx="6" fill="#1d4ed8"/>
  <text x="769" y="610" text-anchor="middle" fill="#525252" font-size="10" class="mono">700</text>

  <rect x="808" y="510" width="64" height="80" rx="6" fill="#1e40af"/>
  <text x="840" y="610" text-anchor="middle" fill="#525252" font-size="10" class="mono">800</text>

  <rect x="879" y="510" width="64" height="80" rx="6" fill="#1e3a8a"/>
  <text x="911" y="610" text-anchor="middle" fill="#525252" font-size="10" class="mono">900</text>

  <rect x="950" y="510" width="64" height="80" rx="10" fill="#172554"/>
  <text x="982" y="610" text-anchor="middle" fill="#525252" font-size="10" class="mono">950</text>

  <!-- Token cards -->
  <!-- Card 1: Primary -->
  <rect x="72" y="670" width="300" height="180" rx="16" fill="#171717" stroke="#262626" stroke-width="1"/>
  <rect x="96" y="694" width="252" height="48" rx="10" fill="#3a86ff"/>
  <text x="96" y="776" fill="#525252" font-size="11" font-weight="500" class="mono" letter-spacing="1.5">PRIMARY</text>
  <text x="96" y="800" fill="#a3a3a3" font-size="14" font-weight="500" class="mono">--color-primary-500</text>
  <text x="96" y="822" fill="#a3a3a3" font-size="14" font-weight="500" class="mono">oklch(0.62 0.21 265)</text>

  <!-- Card 2: Themes -->
  <rect x="390" y="670" width="300" height="180" rx="16" fill="#171717" stroke="#262626" stroke-width="1"/>
  <rect x="414" y="694" width="252" height="48" rx="10" fill="url(#themeChip)"/>
  <text x="414" y="776" fill="#525252" font-size="11" font-weight="500" class="mono" letter-spacing="1.5">THEMES</text>
  <text x="414" y="800" fill="#a3a3a3" font-size="14" font-weight="500" class="mono">Light + Dark</text>
  <text x="414" y="822" fill="#a3a3a3" font-size="14" font-weight="500" class="mono">Semantic tokens</text>

  <!-- Card 3: WCAG -->
  <rect x="708" y="670" width="300" height="180" rx="16" fill="#171717" stroke="#262626" stroke-width="1"/>
  <rect x="732" y="694" width="252" height="48" rx="10" fill="#171717" stroke="#262626" stroke-width="1"/>
  <text x="732" y="776" fill="#525252" font-size="11" font-weight="500" class="mono" letter-spacing="1.5">WCAG</text>
  <text x="732" y="800" fill="#a3a3a3" font-size="14" font-weight="500" class="mono">AA ✓  AAA ✓</text>
  <text x="732" y="822" fill="#a3a3a3" font-size="14" font-weight="500" class="mono">Auto-fixed pairs</text>

  <!-- Tools badge -->
  <rect x="72" y="900" width="680" height="52" rx="100" fill="#171717" stroke="#262626" stroke-width="1"/>
  <circle cx="104" cy="926" r="5" fill="#22c55e"/>
  <text x="124" y="931" fill="#a3a3a3" font-size="14" font-weight="500" class="inter">17 free tools — color mixer, shadow generator, palette checker &amp; more</text>

  <!-- Bottom section -->
  <!-- URL -->
  <text x="72" y="1240" fill="#fafafa" font-size="22" font-weight="600" class="inter" letter-spacing="-0.3">chromabrew.com</text>

  <!-- Free tag -->
  <text x="72" y="1272" fill="#22c55e" font-size="13" font-weight="500" class="mono" letter-spacing="1">100% FREE — NO SIGN-UP</text>

  <!-- Corner marks -->
  <text x="1008" y="1256" text-anchor="end" fill="#404040" font-size="11" class="mono" letter-spacing="1">01 / IG POST</text>
  <text x="1008" y="1274" text-anchor="end" fill="#404040" font-size="11" class="mono" letter-spacing="1">1080 × 1350</text>

  <!-- Subtle border -->
  <rect x="0.5" y="0.5" width="1079" height="1349" rx="0" fill="none" stroke="#262626" stroke-width="1"/>
</svg>
