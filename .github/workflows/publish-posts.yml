name: Publish scheduled posts

# Rebuild production once a day; the gate step only triggers a deploy when a
# post's publishedAt date is today (UTC). Blog pages are statically generated,
# so a future-dated post goes live on the first deploy after its date.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for posts going live today (UTC)
        id: gate
        run: |
          SLUGS=$(node scripts/check-publish-date.mjs "$(date -u +%F)")
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          if [ -n "$SLUGS" ]; then
            echo "Posts going live today: $SLUGS"
          else
            echo "No posts go live today; skipping deploy."
          fi

      # NOTE: the `secrets` context is not allowed in `if:` conditions
      # (GitHub rejects the whole file with "Unrecognized named-value:
      # 'secrets'"), so the secret check lives inside the shell script.
      - name: Trigger Vercel production deploy
        if: steps.gate.outputs.slugs != ''
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL secret is not configured. Today's posts will not publish until a deploy happens. Add the secret in Settings > Secrets and variables > Actions."
          else
            curl --fail -X POST "$VERCEL_DEPLOY_HOOK_URL" -H "Content-Type: application/json" -d '{}'
          fi
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
