<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff006e"/>
      <stop offset="1" stop-color="#3a86ff"/>
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');
    .ser { font-family:'JetBrains Mono',monospace; font-weight:600; font-size:26px; letter-spacing:6px; }
    .h1 { font-family:'Inter',sans-serif; font-weight:800; }
    .mono { font-family:'JetBrains Mono',monospace; }
  </style>

  <rect width="1080" height="1350" fill="#0a0a0a"/>

  <text x="80" y="120" class="ser" fill="#6b7280">CHROMABREW</text>
  <circle cx="1000" cy="104" r="22" fill="#c87cb3"/>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="2"/>

  <text x="80" y="360" class="mono" fill="#3a86ff" font-size="120">05</text>

  <text x="80" y="560" class="h1" fill="#ffffff" font-size="88">One colour.</text>
  <text x="80" y="664" class="h1" fill="#ffffff" font-size="88">Nine shades.</text>

  <text x="80" y="780" class="mono" fill="#6b7280" font-size="26">Every scale is generated, not eyeballed</text>

  <!-- generated scale swatches -->
  <rect x="80" y="840" width="920" height="130" rx="20" fill="#262626"/>
  <circle cx="150" cy="905" r="48" fill="#ff006e"/>
  <circle cx="270" cy="905" r="48" fill="#e3046a"/>
  <circle cx="390" cy="905" r="48" fill="#c10866"/>
  <circle cx="510" cy="905" r="48" fill="#960a5d"/>
  <circle cx="630" cy="905" r="48" fill="#660a4c"/>
  <circle cx="750" cy="905" r="48" fill="#3d0a36"/>
  <circle cx="870" cy="905" r="48" fill="#1a0a1c"/>

  <text x="80" y="1060" class="mono" fill="#9ca3af" font-size="28">50 · 100 · 200 · 500 · 700 · 900</text>
  <text x="80" y="1160" class="mono" fill="#6b7280" font-size="26">From brand scale to semantic tokens</text>

  <line x1="80" y1="1220" x2="1000" y2="1220" stroke="#1f2937" stroke-width="2"/>
  <text x="80" y="1280" class="ser" fill="#6b7280">@CHROMABREW</text>
</svg>