<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff006e"/>
      <stop offset="1" stop-color="#3a86ff"/>
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');
    .ser { font-family:'JetBrains Mono',monospace; font-weight:600; font-size:26px; letter-spacing:6px; }
    .h1 { font-family:'Inter',sans-serif; font-weight:800; }
    .mono { font-family:'JetBrains Mono',monospace; }
  </style>

  <rect width="1080" height="1350" fill="#0a0a0a"/>

  <text x="80" y="120" class="ser" fill="#6b7280">CHROMABREW</text>
  <circle cx="1000" cy="104" r="22" fill="#c87cb3"/>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="2"/>

  <text x="80" y="360" class="mono" fill="#3a86ff" font-size="120">07</text>

  <!-- secondary + accent explained -->
  <rect x="80" y="480" width="920" height="150" rx="24" fill="#141414" stroke="#262626" stroke-width="2"/>
  <circle cx="150" cy="555" r="44" fill="#ff006e"/>
  <text x="230" y="550" class="h1" fill="#ffffff" font-size="44">Primary</text>
  <text x="230" y="600" class="mono" fill="#6b7280" font-size="24">your brand colour</text>

  <rect x="80" y="660" width="920" height="150" rx="24" fill="#141414" stroke="#262626" stroke-width="2"/>
  <circle cx="150" cy="735" r="44" fill="#7c3aed"/>
  <text x="230" y="730" class="h1" fill="#ffffff" font-size="44">Secondary</text>
  <text x="230" y="780" class="mono" fill="#6b7280" font-size="24">supporting actions</text>

  <rect x="80" y="840" width="920" height="150" rx="24" fill="#141414" stroke="#262626" stroke-width="2"/>
  <circle cx="150" cy="915" r="44" fill="#3a86ff"/>
  <text x="230" y="910" class="h1" fill="#ffffff" font-size="44">Accent</text>
  <text x="230" y="960" class="mono" fill="#6b7280" font-size="24">highlights &amp; focus</text>

  <text x="80" y="1090" class="h1" fill="#ffffff" font-size="40">Three roles. Derived from ONE seed.</text>

  <line x1="80" y1="1220" x2="1000" y2="1220" stroke="#1f2937" stroke-width="2"/>
  <text x="80" y="1280" class="ser" fill="#6b7280">@CHROMABREW</text>
</svg>