<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Digital Confidence Day — hosted by Digital Start CIC</title>
  <desc id="desc">Poster for Digital Confidence Day: Learn something new. Do something useful. Feel more confident digitally. Seven practical sessions for people building digital skills.</desc>

  <!-- Background -->
  <rect width="1600" height="900" fill="#F6F1E7"/>
  <rect x="24" y="24" width="1552" height="852" rx="10" fill="none" stroke="#26312F" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Header -->
  <g>
    <rect x="72" y="56" width="44" height="44" rx="4" fill="#E85D3D"/>
    <rect x="82" y="72" width="24" height="5" rx="2.5" fill="#FFFFFF"/>
    <rect x="82" y="83" width="18" height="5" rx="2.5" fill="#FFFFFF"/>
    <rect x="82" y="94" width="10" height="5" rx="2.5" fill="#FFFFFF"/>
    <text x="134" y="85" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#26312F">DIGITAL START CIC</text>
  </g>

  <!-- Title -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#26312F">
    <text x="90" y="188" font-size="114" letter-spacing="1">DIGITAL</text>
    <text x="90" y="310" font-size="114" letter-spacing="1">CONFIDENCE</text>
  </g>

  <!-- DAY plaque -->
  <rect x="90" y="344" width="238" height="120" rx="10" fill="#E85D3D"/>
  <text x="209" y="428" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" fill="#FFFFFF" letter-spacing="2">DAY</text>

  <!-- Tagline -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="32" fill="#26312F">
    <text x="90" y="506">Learn something new. Do something useful.</text>
    <text x="90" y="550">Feel more <tspan fill="#E85D3D" font-weight="700">confident</tspan> digitally.</text>
  </g>

  <!-- Audience -->
  <g font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#45514E">
    <text x="90" y="598">For people returning to learning, jobseekers, older adults</text>
    <text x="90" y="627">and anyone who wants to improve their digital skills.</text>
  </g>

  <!-- Confidence steps -->
  <g>
    <rect x="1000" y="444" width="96" height="76" rx="4" fill="#26312F" fill-opacity="0.10"/>
    <rect x="1104" y="404" width="96" height="116" rx="4" fill="#26312F" fill-opacity="0.22"/>
    <rect x="1208" y="364" width="96" height="156" rx="4" fill="#26312F" fill-opacity="0.38"/>
    <rect x="1312" y="324" width="96" height="196" rx="4" fill="#26312F" fill-opacity="0.60"/>
    <rect x="1416" y="284" width="96" height="236" rx="4" fill="#E85D3D"/>
    <line x1="980" y1="522" x2="1520" y2="522" stroke="#26312F" stroke-opacity="0.20" stroke-width="2"/>
  </g>
  <text x="1260" y="600" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="600" letter-spacing="2" fill="#45514E">DETAILS &amp; VENUE — TO BE ANNOUNCED</text>

  <!-- Sessions -->
  <text x="90" y="660" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#26312F">WHAT'S ON — SEVEN PRACTICAL SESSIONS</text>
  <line x1="490" y1="656" x2="1514" y2="656" stroke="#26312F" stroke-opacity="0.12" stroke-width="2"/>

  <g font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
    <!-- Card 1 -->
    <g>
      <rect x="90" y="690" width="190" height="152" rx="8" fill="#EAE1CF"/>
      <rect x="90" y="690" width="6" height="152" rx="3" fill="#E85D3D"/>
      <text x="106" y="724" font-size="20" font-weight="700" fill="#E85D3D">01</text>
      <text x="106" y="758" font-size="16" font-weight="700" fill="#26312F">Digital<tspan x="106" dy="21">basics</tspan></text>
      <text x="106" y="806" font-size="11.5" fill="#45514E">Phones, email, files<tspan x="106" dy="15">and the internet</tspan></text>
    </g>
    <!-- Card 2 -->
    <g>
      <rect x="294" y="690" width="190" height="152" rx="8" fill="#EAE1CF"/>
      <rect x="294" y="690" width="6" height="152" rx="3" fill="#E85D3D"/>
      <text x="310" y="724" font-size="20" font-weight="700" fill="#E85D3D">02</text>
      <text x="310" y="758" font-size="16" font-weight="700" fill="#26312F">AI for<tspan x="310" dy="21">everyday life</tspan></text>
      <text x="310" y="806" font-size="11.5" fill="#45514E">ChatGPT and practical<tspan x="310" dy="15">AI tools</tspan></text>
    </g>
    <!-- Card 3 -->
    <g>
      <rect x="498" y="690" width="190" height="152" rx="8" fill="#EAE1CF"/>
      <rect x="498" y="690" width="6" height="152" rx="3" fill="#E85D3D"/>
      <text x="514" y="724" font-size="20" font-weight="700" fill="#E85D3D">03</text>
      <text x="514" y="758" font-size="16" font-weight="700" fill="#26312F">Stay safe<tspan x="514" dy="21">online</tspan></text>
      <text x="514" y="806" font-size="11.5" fill="#45514E">Scams, passwords,<tspan x="514" dy="15">phishing and fraud</tspan></text>
    </g>
    <!-- Card 4 -->
    <g>
      <rect x="702" y="690" width="190" height="152" rx="8" fill="#EAE1CF"/>
      <rect x="702" y="690" width="6" height="152" rx="3" fill="#E85D3D"/>
      <text x="718" y="724" font-size="20" font-weight="700" fill="#E85D3D">04</text>
      <text x="718" y="758" font-size="16" font-weight="700" fill="#26312F">Skills for<tspan x="718" dy="21">work</tspan></text>
      <text x="718" y="806" font-size="11.5" fill="#45514E">CVs, LinkedIn and<tspan x="718" dy="15">online interviews</tspan></text>
    </g>
    <!-- Card 5 -->
    <g>
      <rect x="906" y="690" width="190" height="152" rx="8" fill="#EAE1CF"/>
      <rect x="906" y="690" width="6" height="152" rx="3" fill="#E85D3D"/>
      <text x="922" y="724" font-size="20" font-weight="700" fill="#E85D3D">05</text>
      <text x="922" y="758" font-size="16" font-weight="700" fill="#26312F">Make your<tspan x="922" dy="21">phone work</tspan></text>
      <text x="922" y="806" font-size="11.5" fill="#45514E">Useful apps and<tspan x="922" dy="15">everyday tasks</tspan></text>
    </g>
    <!-- Card 6 -->
    <g>
      <rect x="1110" y="690" width="190" height="152" rx="8" fill="#EAE1CF"/>
      <rect x="1110" y="690" width="6" height="152" rx="3" fill="#E85D3D"/>
      <text x="1126" y="724" font-size="20" font-weight="700" fill="#E85D3D">06</text>
      <text x="1126" y="758" font-size="16" font-weight="700" fill="#26312F">Create something<tspan x="1126" dy="21">digital</tspan></text>
      <text x="1126" y="806" font-size="11.5" fill="#45514E">Canva, social posts<tspan x="1126" dy="15">and websites</tspan></text>
    </g>
    <!-- Card 7 -->
    <g>
      <rect x="1314" y="690" width="190" height="152" rx="8" fill="#EAE1CF"/>
      <rect x="1314" y="690" width="6" height="152" rx="3" fill="#E85D3D"/>
      <text x="1330" y="724" font-size="20" font-weight="700" fill="#E85D3D">07</text>
      <text x="1330" y="758" font-size="16" font-weight="700" fill="#26312F">1-to-1 digital<tspan x="1330" dy="21">help desk</tspan></text>
      <text x="1330" y="806" font-size="11.5" fill="#45514E">Bring a device and<tspan x="1330" dy="15">get personal help</tspan></text>
    </g>
  </g>
</svg>